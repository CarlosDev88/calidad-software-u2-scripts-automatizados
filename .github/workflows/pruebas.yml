# Integracion continua: en cada push o pull request GitHub corre todas las pruebas automaticamente.
name: Pruebas automatizadas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # permite correrlo a mano desde la pestana Actions

jobs:

  # JUnit 5 (unitarias + API con TestRestTemplate + formulario con Selenium) y cobertura JaCoCo
  junit-selenium:
    name: JUnit + Selenium + cobertura
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # El runner de GitHub ya trae Google Chrome; Selenium lo usa en modo headless
      - name: Correr todas las pruebas y verificar cobertura
        run: mvn -B verify

      - name: Guardar evidencias (capturas, resultados y cobertura)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-junit-selenium
          path: |
            evidencias/
            target/surefire-reports/
            target/site/jacoco/

  # Coleccion Postman ejecutada con Newman contra la app levantada en Docker
  postman:
    name: Postman (Newman)
    runs-on: ubuntu-latest
    needs: junit-selenium
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Levantar la app y correr la coleccion
        run: docker compose --profile postman run --rm newman

      - name: Apagar contenedores
        if: always()
        run: docker compose --profile postman down

      - name: Guardar resultado de Newman
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-postman
          path: evidencias/newman-resultados.xml
