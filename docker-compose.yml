# Infraestructura completa para correr las pruebas sin instalar Java, Maven ni Chrome.
#
#   Pruebas (JUnit + TestRestTemplate + Selenium):
#     docker compose up --build --exit-code-from tests
#
#   Pruebas Postman con Newman:
#     docker compose --profile postman run --rm newman
#
#   Ver la app en el navegador (http://localhost:8080/registro.html):
#     docker compose --profile demo up --build app
#
#   Apagar todo:
#     docker compose --profile demo --profile postman down

name: taller-scripts-automatizados

services:

  # Navegador Chrome controlado por Selenium (version exacta)
  chrome:
    image: selenium/standalone-chrome:4.25.0-20240922
    shm_size: "2gb"
    ports:
      - "4444:4444"   # Selenium Grid
      - "7900:7900"   # Ver el navegador en vivo: http://localhost:7900 (clave: secret)
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4444/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24

  # Corre todas las pruebas automatizadas y deja las evidencias en ./evidencias
  tests:
    build: .
    image: taller-scripts-automatizados:1.0.0
    depends_on:
      chrome:
        condition: service_healthy
    environment:
      SELENIUM_REMOTE_URL: http://chrome:4444
      APP_HOST: tests          # nombre con el que el Chrome del contenedor llega a la app
      EVIDENCIAS_DIR: /app/evidencias
    volumes:
      - ./evidencias:/app/evidencias

  # App levantada para usarla a mano o desde Postman
  app:
    profiles: ["demo", "postman"]
    build: .
    image: taller-scripts-automatizados:1.0.0
    command: ["mvn", "-B", "-q", "spring-boot:run"]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/usuarios || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s

  # Corre la coleccion de Postman contra la app
  newman:
    profiles: ["postman"]
    image: postman/newman:6.1.3-alpine
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./postman:/etc/newman
      - ./evidencias:/evidencias
    command:
      - run
      - usuarios.postman_collection.json
      - --env-var
      - baseUrl=http://app:8080
      - --reporters
      - cli,junit
      - --reporter-junit-export
      - /evidencias/newman-resultados.xml
